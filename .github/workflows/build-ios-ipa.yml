name: KanadeDX iOS Xcode Project

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Apple App ID / Bundle Identifier"
        required: true
        default: app.KanadeDX
        type: string

permissions:
  contents: read

env:
  UNITY_PROJECT: .
  UNITY_VERSION: 2022.3.62f3

jobs:
  build-xcode-project:
    name: Unity → Xcode project (no Apple signing)
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-ios-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-library-ios-${{ env.UNITY_VERSION }}-

      - name: Build Unity iOS Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: KanadeDXiOSBuild.Build
          allowDirtyBuild: true

      - name: Verify generated Xcode project
        run: |
          test -f Builds/iOS/Unity-iPhone.xcodeproj/project.pbxproj
          test -f Builds/iOS/Info.plist
          test -f Builds/iOS/KanadeDX.entitlements

          grep -q 'NFCReaderUsageDescription' Builds/iOS/Info.plist

          grep -q \
            'com.apple.developer.nfc.readersession.formats' \
            Builds/iOS/KanadeDX.entitlements

          grep -q 'TAG' Builds/iOS/KanadeDX.entitlements

          echo "Xcode project verified."
          echo "NFC configuration verified."

      - name: Inspect signing configuration
        run: |
          xcodebuild \
            -project Builds/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -showBuildSettings \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | grep -E \
              'PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN|INFOPLIST_FILE|CODE_SIGN_ENTITLEMENTS' \
              || true

      - name: Package Xcode project
        run: |
          rm -f Builds/KanadeDX-iOS-XcodeProject.zip

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            Builds/iOS \
            Builds/KanadeDX-iOS-XcodeProject.zip

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: KanadeDX-iOS-XcodeProject
          path: Builds/KanadeDX-iOS-XcodeProject.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KanadeDX-build-diagnostics
          path: |
            Builds/**/*.log
            Builds/iOS/Info.plist
            Builds/iOS/KanadeDX.entitlements
          if-no-files-found: ignore
          retention-days: 7